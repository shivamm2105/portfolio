<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="favText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBg)"/>

  <!-- Glowing Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#favBorder)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- SC Monogram Text -->
  <text
    x="32"
    y="42"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="30"
    font-weight="900"
    fill="url(#favText)"
    text-anchor="middle"
    letter-spacing="-1"
  >SC</text>

  <!-- Code Accent Line under SC -->
  <line x1="14" y1="49" x2="50" y2="49" stroke="url(#favBorder)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
